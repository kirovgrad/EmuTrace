name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-decompiler.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-decompiler.txt

      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check viewer
        run: |
          pnpm run format:check
          pnpm test

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Test viewer in Chromium
        run: pnpm run test:ui
